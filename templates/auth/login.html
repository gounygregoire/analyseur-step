<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - CADlytics</title>
    <link rel="stylesheet" href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        :root {
            --kaki-light: #a8a068;
            --kaki-dark: #6d6843;
            --brown-light: #8b6f47;
            --brown-dark: #5c4933;
            --accent-gold: #d4af37;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d30 100%);
            min-height: 100vh;
        }
        
        .navbar {
            background: rgba(26, 26, 26, 0.95) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--kaki-dark);
        }
        
        .navbar-brand {
            color: var(--kaki-light) !important;
            font-weight: 700;
        }
        
        .card {
            background: rgba(45, 45, 48, 0.95) !important;
            border: 1px solid var(--kaki-dark) !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3) !important;
        }
        
        .form-control {
            background: rgba(26, 26, 26, 0.8) !important;
            border: 2px solid var(--kaki-dark) !important;
            color: #ffffff !important;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            background: rgba(26, 26, 26, 0.9) !important;
            border-color: var(--kaki-light) !important;
            box-shadow: 0 0 0 0.2rem rgba(168, 160, 104, 0.25) !important;
            color: #ffffff !important;
        }
        
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.5) !important;
        }
        
        .form-label {
            color: rgba(255, 255, 255, 0.9) !important;
            font-weight: 500;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--kaki-dark) 0%, var(--brown-dark) 100%) !important;
            border: none !important;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, var(--kaki-light) 0%, var(--brown-light) 100%) !important;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(168, 160, 104, 0.3);
        }
        
        .btn-outline-secondary {
            border: 2px solid var(--kaki-dark) !important;
            color: var(--kaki-light) !important;
            transition: all 0.3s ease;
        }
        
        .btn-outline-secondary:hover {
            background: var(--kaki-dark) !important;
            border-color: var(--kaki-light) !important;
            color: #ffffff !important;
        }
        
        h2 {
            color: var(--kaki-light) !important;
            font-weight: 700;
        }
        
        .text-muted {
            color: rgba(255, 255, 255, 0.6) !important;
        }
        
        a {
            color: var(--kaki-light) !important;
            text-decoration: none;
        }
        
        a:hover {
            color: var(--accent-gold) !important;
        }
        
        .alert-danger {
            background: rgba(220, 53, 69, 0.2) !important;
            border: 1px solid rgba(220, 53, 69, 0.5) !important;
            color: #ff8a8a !important;
        }
        
        hr {
            border-color: var(--kaki-dark) !important;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('landing') }}">
                <i class="bi bi-gear-fill text-primary me-2"></i>CADlytics
            </a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-lg">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-4">Connexion</h2>
                        
                        {% with messages = get_flashed_messages(with_categories=true) %}
                            {% if messages %}
                                {% for category, message in messages %}
                                    <div class="alert alert-{{ 'danger' if category == 'danger' else category }} alert-dismissible fade show" role="alert">
                                        {{ message }}
                                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                    </div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}

                        <form method="POST" action="{{ url_for('auth.login') }}">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            
                            <div class="mb-4">
                                <label for="password" class="form-label">Mot de passe</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100 mb-3">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
                            </button>
                        </form>

                        <div class="text-center mb-3">
                            <span class="text-muted">ou</span>
                        </div>

                        <a href="{{ url_for('google_auth.google_login') }}" class="btn btn-outline-secondary w-100 mb-3">
                            <i class="bi bi-google me-2"></i>Continuer avec Google
                        </a>

                        <hr>

                        <p class="text-center mb-0">
                            Pas encore de compte ? 
                            <a href="{{ url_for('auth.register') }}">S'inscrire</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
