<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>CADlytics Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- (Optionnel) tes CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
  <style>
    /* mini styles pour que ça rende tout de suite */
    .viewer-wrapper { position: relative; width: 100%; height: 70vh; background:#111; border-radius:8px; overflow: hidden; }
    #viewer3d { width: 100%; height: 100%; display:block; }
    .toolbar { position:absolute; top:10px; left:10px; display:flex; gap:8px; z-index:10; }
    .toolbar button.active { background:#2e7d32; color:#fff; }
    .explode-slider { position:absolute; bottom:12px; left:12px; width: 280px; z-index:10; }
    .panel { position:absolute; top:0; right:0; width:300px; height:100%; background:#fff; color:#222; box-shadow:-2px 0 12px rgba(0,0,0,.25); transform: translateX(0); transition: transform .2s ease; z-index:11; }
    .panel.collapsed { transform: translateX(100%); }
    .panel-header { display:flex; align-items:center; justify-content: space-between; padding:10px 12px; border-bottom:1px solid #ddd; font-weight:600; }
    .panel-section { padding:12px; border-bottom:1px solid #eee; }
    .context-menu { position:absolute; list-style:none; margin:0; padding:6px 0; background:#fff; border:1px solid #ccc; border-radius:6px; display:none; z-index:100; }
    .context-menu.show { display:block; }
    .context-menu li { padding:6px 12px; cursor:pointer; }
    .context-menu li:hover { background:#f0f0f0; }
    .tooltip { position:fixed; padding:4px 8px; background:#000; color:#fff; font-size:12px; border-radius:4px; pointer-events:none; opacity:.85; display:none; }
    .tooltip.show { display:block; }
  </style>
</head>

{# IMPORTANT : data-model doit contenir le nom du .xkt à charger (si présent) #}
<body {% if model %}data-model="{{ model }}"{% endif %}>

  <!-- === CONTENEUR VIEWER === -->
  <div id="viewer" class="viewer-wrapper mt-2">
    <!-- Canvas -->
    <canvas id="viewer3d"></canvas>

    <!-- Barre d’outils -->
    <div id="toolbar" class="toolbar">
      <button id="fitBtn"      title="Ajuster (F)">Fit</button>
      <button id="measureBtn"  title="Mesure (M)">Mesure</button>
      <button id="sectionBtn"  title="Coupes (X)">Coupes</button>
      <button id="explodeBtn"  title="Explosion (E)">Explosion</button>
      <button id="isoBtn"      title="Isoler sélection (I)">Isoler</button>
      <button id="edgesBtn"    title="Arêtes / Filaire">Arêtes</button>
      <button id="resetBtn"    title="Réinitialiser (R)">Reset</button>
      <button id="pngBtn"      title="Exporter PNG">PNG</button>
    </div>

    <!-- Slider explosion -->
    <input id="explodeRange" type="range" min="0" max="100" value="0" class="explode-slider" />

    <!-- Panneau latéral -->
    <aside id="sidePanel" class="panel collapsed">
      <div class="panel-header">
        <span>Outils</span>
        <button id="panelToggle" class="chevron" onclick="document.getElementById('sidePanel').classList.toggle('collapsed')">›</button>
      </div>

      <section class="panel-section">
        <h5>Mesures</h5>
        <ul id="measureList"></ul>
        <button id="clearMeasures" class="btn btn-sm btn-outline-danger">Reset mesures</button>
      </section>

      <section class="panel-section">
        <h5>Coupes</h5>
        <div class="section-control" data-plane="0">
          <label>Plan 1</label>
          <input type="range" min="-1" max="1" step="0.01" value="0" />
        </div>
        <div class="section-control" data-plane="1">
          <label>Plan 2</label>
          <input type="range" min="-1" max="1" step="0.01" value="0" />
        </div>
        <div class="section-control" data-plane="2">
          <label>Plan 3</label>
          <input type="range" min="-1" max="1" step="0.01" value="0" />
        </div>
      </section>
    </aside>

    <!-- Menu contextuel -->
    <ul id="contextMenu" class="context-menu">
      <li data-action="isolate">Isoler</li>
      <li data-action="hide">Masquer</li>
      <li data-action="showAll">Tout afficher</li>
    </ul>
  </div>
  <!-- === FIN VIEWER === -->

  <!-- Charge le JS (VERSION SANS EdgesPlugin !) depuis /static/js/main.js -->
  <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
