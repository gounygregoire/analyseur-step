<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADlytics - Téléchargement</title>
    <link href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d30 100%);
            min-height: 100vh;
        }
        .upload-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            color: #8B7355;
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .upload-zone {
            border: 2px dashed #8B7355;
            border-radius: 10px;
            padding: 50px;
            text-align: center;
            transition: all 0.3s ease;
            background: rgba(139, 115, 85, 0.1);
        }
        .upload-zone:hover {
            border-color: #A0826D;
            background: rgba(139, 115, 85, 0.2);
        }
        .upload-zone.dragover {
            border-color: #DAA520;
            background: rgba(218, 165, 32, 0.2);
        }
        .btn-analyze {
            background: linear-gradient(135deg, #8B7355, #A0826D);
            border: none;
            color: white;
            padding: 12px 40px;
            font-size: 1.1rem;
            border-radius: 25px;
            transition: all 0.3s ease;
            margin-top: 20px;
            display: none;
        }
        .btn-analyze:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(139, 115, 85, 0.4);
        }
        .file-info {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            display: none;
        }
        .progress {
            height: 25px;
            background-color: rgba(255, 255, 255, 0.1);
            margin-top: 20px;
            display: none;
        }
        .progress-bar {
            background: linear-gradient(90deg, #8B7355, #DAA520);
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/" style="color: #8B7355; font-weight: bold;">
                <i class="bi bi-box me-2"></i>CADlytics
            </a>
            <div class="navbar-nav ms-auto">
                {% if current_user.is_authenticated %}
                    <span class="navbar-text me-3">{{ current_user.email }}</span>
                    <a class="nav-link" href="{{ url_for('auth.logout') }}">Déconnexion</a>
                {% else %}
                    <a class="nav-link" href="{{ url_for('auth.login') }}">Connexion</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="upload-container">
        <div class="logo">
            <i class="bi bi-box" style="font-size: 3rem; color: #8B7355;"></i>
            <h1>CADlytics</h1>
            <p class="text-muted">Analyse DFM pour l'injection plastique</p>
        </div>

        <form id="uploadForm" enctype="multipart/form-data">
            <div class="upload-zone" id="dropZone">
                <i class="bi bi-cloud-upload" style="font-size: 3rem; color: #8B7355;"></i>
                <h4 class="mt-3">Glissez votre fichier STEP ici</h4>
                <p class="text-muted">ou cliquez pour parcourir</p>
                <input type="file" id="fileInput" name="file" accept=".step,.stp,.STEP,.STP" style="display: none;">
                <button type="button" class="btn btn-outline-light mt-3" onclick="document.getElementById('fileInput').click()">
                    <i class="bi bi-folder-open me-2"></i>Choisir un fichier
                </button>
            </div>

            <div class="file-info" id="fileInfo">
                <h5><i class="bi bi-file-earmark-check me-2"></i>Fichier sélectionné</h5>
                <p class="mb-0" id="fileName"></p>
                <small class="text-muted" id="fileSize"></small>
            </div>

            <div class="progress" id="progressBar">
                <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-analyze" id="analyzeBtn">
                    <i class="bi bi-search me-2"></i>Analyser
                </button>
            </div>
        </form>

        <div class="alert alert-danger mt-3" id="errorAlert" style="display: none;"></div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const uploadForm = document.getElementById('uploadForm');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const progressBar = document.getElementById('progressBar');
        const progressBarInner = progressBar.querySelector('.progress-bar');
        const errorAlert = document.getElementById('errorAlert');

        // Drag and drop events
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            dropZone.classList.add('dragover');
        }

        function unhighlight(e) {
            dropZone.classList.remove('dragover');
        }

        dropZone.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        }

        fileInput.addEventListener('change', function(e) {
            handleFiles(e.target.files);
        });

        function handleFiles(files) {
            if (files.length > 0) {
                const file = files[0];
                if (file.name.match(/\.(step|stp)$/i)) {
                    fileName.textContent = file.name;
                    fileSize.textContent = `Taille: ${(file.size / 1024 / 1024).toFixed(2)} MB`;
                    fileInfo.style.display = 'block';
                    analyzeBtn.style.display = 'inline-block';
                    errorAlert.style.display = 'none';
                } else {
                    showError('Veuillez sélectionner un fichier STEP (.step ou .stp)');
                }
            }
        }

        function showError(message) {
            errorAlert.textContent = message;
            errorAlert.style.display = 'block';
            setTimeout(() => {
                errorAlert.style.display = 'none';
            }, 5000);
        }

        uploadForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!fileInput.files[0]) {
                showError('Veuillez sélectionner un fichier');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            analyzeBtn.disabled = true;
            analyzeBtn.innerHTML = '<i class="bi bi-hourglass-split me-2"></i>Analyse en cours...';
            progressBar.style.display = 'block';
            
            // Simulate progress
            let progress = 0;
            const progressInterval = setInterval(() => {
                progress += Math.random() * 15;
                if (progress > 90) progress = 90;
                progressBarInner.style.width = progress + '%';
            }, 300);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                clearInterval(progressInterval);
                progressBarInner.style.width = '100%';

                if (response.ok) {
                    const data = await response.json();
                    // Rediriger vers la page de résultats
                    window.location.href = `/result/${data.id}`;
                } else {
                    const error = await response.json();
                    showError(error.error || 'Erreur lors du téléchargement');
                    analyzeBtn.disabled = false;
                    analyzeBtn.innerHTML = '<i class="bi bi-search me-2"></i>Analyser';
                    progressBar.style.display = 'none';
                }
            } catch (error) {
                clearInterval(progressInterval);
                showError('Erreur de connexion au serveur');
                analyzeBtn.disabled = false;
                analyzeBtn.innerHTML = '<i class="bi bi-search me-2"></i>Analyser';
                progressBar.style.display = 'none';
            }
        });
    </script>
</body>
</html>
