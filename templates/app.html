<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Analyse & Visualisation 3D • CADlytics</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <style>
      :root{--green:#3b5b39;--card: #fff;}
      body{background:#f6f4ef;color:#283327;font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif}
      .wrap{max-width:1200px;margin:24px auto;padding:0 16px}
      .grid{display:grid;grid-template-columns:360px 1fr;gap:24px;align-items:start}
      .card{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 8px 32px rgba(0,0,0,.06)}
      #viewerContainer{width:100%;min-height:420px;position:relative;border-radius:14px;overflow:hidden}
      .btn{padding:10px 16px;border:0;border-radius:10px;cursor:pointer}
      .btn-primary{background:var(--green);color:#fff}
      .muted{opacity:.75}
      [data-dropzone].is-success{outline:2px solid #38a169;box-shadow:0 0 0 4px rgba(56,161,105,.18)}
      [data-dropzone].is-ready  {outline:2px solid #2b6cb0;box-shadow:0 0 0 4px rgba(43,108,176,.18)}
      [data-dropzone].is-error  {outline:2px solid #e53e3e;box-shadow:0 0 0 4px rgba(229,62,62,.18)}
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Analyse & Visualisation 3D</h1>
      <div class="grid">
        <div class="card" data-dropzone>
          <h3>Télécharger un fichier</h3>
          <p class="muted">Formats : <code>.stp</code>, <code>.step</code> (≤ 50 MB)</p>
          <div style="display:flex;gap:8px;align-items:center;margin:12px 0;">
            <input id="fileInput" type="file" accept=".stp,.step" hidden />
            <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">CHOISIR UN FICHIER</button>
            <button id="btnVisualiser" class="btn">VISUALISER</button>
          </div>
          <label for="toleranceSelect" class="muted" style="display:block;margin-top:6px;">Tolérance de conversion</label>
          <select id="toleranceSelect" style="display:block;margin-top:6px;">
            <option value="standard">Standard (0.1 mm)</option>
          </select>
        </div>

        <div class="card" style="padding:0">
          <div id="viewerContainer"><
          <canvas id="xktCanvas" style="width:100%;height:100%"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- Fallback : tente le bundle /static/dist/main.js, sinon charge /static/js/main.js -->
<!-- Fallback : tente le bundle /static/dist/main.js, sinon charge /static/js/main.js -->
<script type="module">
  // 1) Importer SANS CameraControl
  import { Viewer, XKTLoaderPlugin }
    from "https://cdn.jsdelivr.net/npm/@xeokit/xeokit-sdk/dist/xeokit-sdk.es.min.js";

  // 2) Sélecteurs
  const fileInput = document.getElementById("fileInput");
  const btnVisual = document.getElementById("btnVisualiser");
  const dropzone  = document.querySelector("[data-dropzone]");

  // 3) Viewer (le viewer expose déjà viewer.cameraControl)
  const viewer     = new Viewer({ canvasId: "xktCanvas" });
  const xktLoader  = new XKTLoaderPlugin(viewer);

  let selectedFile = null;
  fileInput.addEventListener("change", (e) => {
    selectedFile = e.target.files?.[0] || null;
    dropzone?.classList.remove("is-error","is-success");
    dropzone?.classList.add("is-ready");
  });

  async function uploadAndGetXKT(file) {
    const fd = new FormData();
    fd.append("file", file);
    const res = await fetch("/upload", { method: "POST", body: fd });
    const j   = await res.json();
    if (!res.ok || j.error) throw new Error(j.detail || j.error || "upload_failed");

    let url = j.xkt_url;
    const id = j.file_id;
    while (!url) {
      await new Promise(r => setTimeout(r, 1200));
      const s  = await fetch(`/convert/status?file_id=${encodeURIComponent(id)}`);
      const sj = await s.json();
      if (sj.status === "ready") url = sj.xkt_url;
    }
    return url;
  }

  btnVisual.addEventListener("click", async () => {
    if (!selectedFile) { alert("Choisis un fichier .stp / .step"); return; }
    try {
      dropzone?.classList.add("is-ready");

      const xktURL = await uploadAndGetXKT(selectedFile);

      // Reset scène et chargement du XKT
      viewer.scene.clear();
      await xktLoader.load({ id: `model_${Date.now()}`, src: xktURL, edges: true });

      // Fit caméra si dispo
      try { viewer.cameraControl?.fitAll(); } catch(_) {}

      dropzone?.classList.remove("is-ready","is-error");
      dropzone?.classList.add("is-success");
    } catch (err) {
      console.error(err);
      dropzone?.classList.remove("is-ready");
      dropzone?.classList.add("is-error");
      alert("Erreur de conversion ou de chargement. Ouvre ‘Network’ pour le détail.");
    }
  });

  // Drag & drop (optionnel)
  const dz = dropzone;
  if (dz) {
    ["dragenter","dragover"].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add("is-ready"); }));
    ["dragleave","drop"].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove("is-ready"); }));
    dz.addEventListener("drop", (e) => {
      const f = e.dataTransfer?.files?.[0];
      if (f) {
        selectedFile = f;
        fileInput.files = e.dataTransfer.files;
        dz.classList.add("is-ready");
      }
    });
  }
</script>

  </body>
</html>
