<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Analyse & Visualisation 3D · xeokit · XKT</title>

  <!-- Styles -->
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="wrap">
    <h1 class="sr-only">Analyse & Visualisation 3D</h1>

    <div class="grid">
      <!-- ====== Panneau gauche ====== -->
      <div class="card sidebar">
        <div class="card-section">
          <h2 class="card-title">Fichiers</h2>
          <div class="row g8">
            <input id="fileInput" type="file" accept=".stp,.step,.stl" hidden />
            <button id="btnChoose" class="btn btn-outline mini">CHOISIR</button>
            <button id="btnVisualiser" class="btn btn-outline mini">VISUALISER</button>
            <label class="row g6 ai-center">
              <input id="chkAdditive" type="checkbox" />
              <span>Ajouter (multi-modèles)</span>
            </label>
          </div>
          <div id="fileName" class="muted" style="margin-top:.5rem"></div>
        </div>

        <div class="card-section">
          <h2 class="card-title">Navigation</h2>
          <div class="row g6">
            <button id="btnFit" class="btn btn-outline mini">FIT</button>
            <button id="btnProj" class="btn btn-outline mini">PERSPECTIVE</button>
            <select id="navMode" class="select mini" style="min-width:120px">
              <option value="orbit">ORBIT</option>
              <option value="firstPerson">FIRST-PERSON</option>
              <option value="pan">PAN</option>
            </select>
          </div>

          <div class="row g14" style="margin-top:.5rem">
            <label class="row g6 ai-center"><input id="chkEdges" type="checkbox" checked /> <span>Arêtes</span></label>
            <label class="row g6 ai-center"><input id="chkXray"  type="checkbox" /> <span>X-ray</span></label>
            <label class="row g6 ai-center"><input id="chkGhost" type="checkbox" /> <span>Ghost</span></label>
          </div>

          <label class="row g6 ai-center" style="margin-top:.5rem">
            <input id="chkTheme" type="checkbox" />
            <span>Thème sombre (viewer)</span>
          </label>
        </div>

        <div class="card-section">
          <h2 class="card-title">Modèles</h2>
          <div id="modelsList" class="stack g6"></div>
          <div class="row g8" style="margin-top:.5rem">
            <button id="btnReload" class="btn btn-outline mini">RECHARGER</button>
            <button id="btnUnload" class="btn btn-outline mini">DÉCHARGER</button>
          </div>
        </div>

        <div class="card-section">
          <h2 class="card-title">Sélection</h2>
          <div class="row g8">
            <button id="btnIsolate"   class="btn btn-outline mini">ISOLER</button>
            <button id="btnHide"      class="btn btn-outline mini">CACHER</button>
            <button id="btnShowOnly"  class="btn btn-outline mini">MONTRER SEUL</button>
            <button id="btnClearSel"  class="btn btn-outline mini">TOUT MONTRER</button>
          </div>
          <label class="row g8 ai-center" style="margin-top:.6rem">
            <span class="muted" style="min-width:60px">Opacité</span>
            <input id="opacityRange" type="range" min="0.05" max="1" step="0.01" value="1" style="flex:1" />
          </label>
        </div>

        <div class="card-section">
          <h2 class="card-title">Recherche</h2>
          <div class="row g8">
            <input id="searchInput" class="input mini" placeholder="ID / TYPE / NOM…" />
            <button id="btnSearch" class="btn btn-outline mini">RECHERCHER</button>
          </div>
          <div id="results" class="stack g6" style="margin-top:.5rem;max-height:180px;overflow:auto"></div>
        </div>

        <div class="card-section">
          <h2 class="card-title">Propriétés</h2>
          <div id="propsPanel" class="props-grid"></div>
        </div>
      </div>

      <!-- ====== Viewer ====== -->
      <div class="card viewer">
        <div class="row mini toolbar">
          <button id="btnMeasure" class="btn btn-outline mini">MESURE</button>
          <button id="btnAnnot"   class="btn btn-outline mini">ANNOTATION</button>

          <button class="btn btn-outline mini clipAxis" data-axis="x">COUPE X</button>
          <button class="btn btn-outline mini clipAxis" data-axis="y">COUPE Y</button>
          <button class="btn btn-outline mini clipAxis" data-axis="z">COUPE Z</button>
          <input id="clipRange" type="range" min="-100" max="100" value="0" style="margin-left:8px;flex:1" />

          <button id="btnShot" class="btn btn-outline mini">SCREENSHOT</button>
        </div>

        <div id="viewerShell" class="viewerShell">
          <div id="viewerContainer">
            <canvas id="xeokit-canvas" class="xkt-canvas"></canvas>
            <!-- IMPORTANT: les overlays sont dans le container du viewer -->
            <div id="overlayHost"></div>
          </div>

          <!-- Barre de progression fine -->
          <div class="row mini" style="margin-top:10px">
            <div class="progress">
              <div id="progressBar" class="progress-bar"></div>
            </div>
            <span class="muted">Progression</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Script -->
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
