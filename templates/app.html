<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Analyse & Visualisation 3D — xeokit</title>

  <!-- Style global -->
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="wrap">
    <h2>Analyse & Visualisation 3D <small style="opacity:.6">xeokit + XKT</small></h2>

    <div class="grid">
      <!-- Panneau gauche -->
      <div class="card">
        <div class="pane">
          <h4 style="margin:6px 0 10px">Fichiers</h4>
          <div class="row mini">
            <button id="btnChoose" class="btn mini">CHOISIR</button>
            <button id="btnVisualiser" class="btn mini">VISUALISER</button>
            <label class="row mini" style="margin-left:auto"><input id="chkAdditive" type="checkbox" /> <span>Ajouter (multi-modèles)</span></label>
          </div>
          <input id="fileInput" type="file" style="display:none" accept=".stp,.step,.stl,.xkt" />
          <div id="fileName" style="font-size:12px;color:#777;margin-top:6px"></div>
        </div>

        <div class="pane">
          <h4 style="margin:6px 0 10px">Navigation</h4>
          <div class="row mini">
            <button id="btnFit" class="btn mini">FIT</button>
            <button id="btnProj" class="btn mini">PERSPECTIVE</button>
          </div>
          <div class="row mini" style="margin-top:6px">
            <label><input id="chkEdges" type="checkbox" checked /> Arêtes</label>
            <label><input id="chkXray" type="checkbox" /> X-ray</label>
            <label><input id="chkGhost" type="checkbox" /> Ghost</label>
          </div>
          <div class="row mini">
            <label><input id="chkTheme" type="checkbox" /> Thème sombre</label>
          </div>
        </div>

        <div class="pane">
          <h4 style="margin:6px 0 10px">Sélection</h4>
          <div class="row mini">
            <button id="btnIsolate" class="btn mini">ISOLER</button>
            <button id="btnHide" class="btn mini">CACHER</button>
          </div>
          <div class="row mini">
            <button id="btnShowOnly" class="btn mini">MONTRER SEUL</button>
            <button id="btnClearSel" class="btn mini">TOUT MONTRER</button>
          </div>
          <div class="row mini" style="margin-top:8px">
            <label>Opacité</label>
            <input id="opacityRange" type="range" min="0.05" max="1" step="0.05" value="1" />
          </div>
        </div>

        <div class="pane">
          <h4 style="margin:6px 0 10px">Recherche</h4>
          <div class="row mini">
            <input id="searchInput" type="search" placeholder="ID / TYPE / NOM..." />
            <button id="btnSearch" class="btn mini">RECHERCHER</button>
          </div>
          <div id="results" style="font-size:12px;margin-top:6px"></div>
        </div>

        <div class="pane">
          <h4 style="margin:6px 0 10px">Propriétés</h4>
          <div id="propsPanel" style="display:grid;grid-template-columns:120px 1fr;gap:6px;font-size:12px"></div>
        </div>
      </div>

      <!-- Viewer -->
      <div class="card">
        <div class="pane row mini" style="margin-bottom:0">
          <button id="btnMeasure" class="btn btn-outline mini">MESURE</button>
          <button id="btnAnnot" class="btn btn-outline mini">ANNOTATION</button>

          <button class="btn btn-outline mini clipAxis" data-axis="x">COUPE X</button>
          <button class="btn btn-outline mini clipAxis" data-axis="y">COUPE Y</button>
          <button class="btn btn-outline mini clipAxis" data-axis="z">COUPE Z</button>
          <input id="clipRange" type="range" min="-100" max="100" value="0" />
          <div style="flex:1"></div>
          <button id="btnShot" class="btn btn-outline mini">SCREENSHOT</button>
        </div>

        <div id="viewerShell" class="pane" style="padding-top:8px">
          <div id="viewerContainer">
            <canvas id="xeokit-canvas"></canvas>
            <!-- IMPORTANT : overlay parfaitement superposé -->
            <div id="overlayHost"></div>
          </div>

          <div class="row mini" style="margin-top:10px;opacity:.8">
            <div style="font-size:12px">Progression</div>
            <div style="flex:1;background:#eef0f3;height:6px;border-radius:4px;overflow:hidden">
              <div id="progressBar" style="height:100%;background:#c2d6ff;width:0%"></div>
            </div>
          </div>
        </div>
      </div>
    </div> <!-- /grid -->
  </div> <!-- /wrap -->

  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
