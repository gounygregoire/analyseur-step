<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Analyse & Visualisation 3D — xeokit</title>

  <!-- Style global -->
  <link rel="stylesheet" href="/static/css/style.css" />

  <!-- Style léger pour le trièdre d'axes -->
  <style>
    .axis-overlay{
      position:absolute; left:18px; top:90px;
      width:84px; height:84px; z-index:6;
      pointer-events:none; opacity:.9;
      border-radius:12px; backdrop-filter: blur(2px);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>Analyse & Visualisation 3D <small style="opacity:.6">xeokit + XKT</small></h2>

    <div class="grid">
      <!-- Panneau gauche -->
      <div class="card">
        <div class="pane">
          <h4 style="margin:6px 0 10px">Fichiers</h4>
          <div class="row mini">
            <button id="btnChoose" class="btn mini">CHOISIR</button>
            <button id="btnVisualiser" class="btn mini">VISUALISER</button>
            <label class="row mini" style="margin-left:auto">
              <input id="chkAdditive" type="checkbox" />
              <span>Ajouter (multi-modèles)</span>
            </label>
          </div>
          <input id="fileInput" type="file" style="display:none" accept=".stp,.step,.stl,.xkt" />
          <div id="fileName" style="font-size:12px;color:#777;margin-top:6px"></div>
        </div>

        <div class="pane">
          <h4 style="margin:6px 0 10px">Navigation</h4>
          <div class="row mini">
            <button id="btnFit" class="btn mini">FIT</button>
            <button id="btnProj" class="btn mini">PERSPECTIVE</button>
          </div>
          <div class="row mini" style="margin-top:6px">
            <label><input id="chkEdges" type="checkbox" checked /> Arêtes</label>
            <label><input id="chkXray" type="checkbox" /> X-ray</label>
            <label><input id="chkGhost" type="checkbox" /> Ghost</label>
          </div>
          <div class="row mini">
            <label><input id="chkTheme" type="checkbox" /> Thème sombre</label>
          </div>
        </div>

        <div class="pane">
          <h4 style="margin:6px 0 10px">Sélection</h4>
          <div class="row mini">
            <button id="btnIsolate" class="btn mini">ISOLER</button>
            <button id="btnHide" class="btn mini">CACHER</button>
          </div>
          <div class="row mini">
            <button id="btnShowOnly" class="btn mini">MONTRER SEUL</button>
            <button id="btnClearSel" class="btn mini">TOUT MONTRER</button>
          </div>
          <div class="row mini" style="margin-top:8px">
            <label>Opacité</label>
            <input id="opacityRange" type="range" min="0.05" max="1" step="0.05" value="1" />
          </div>
        </div>

        <div class="pane">
          <h4 style="margin:6px 0 10px">Recherche</h4>
          <div class="row mini">
            <input id="searchInput" type="search" placeholder="ID / TYPE / NOM..." />
            <button id="btnSearch" class="btn mini">RECHERCHER</button>
          </div>
          <div id="results" style="font-size:12px;margin-top:6px"></div>
        </div>

        <div class="pane">
          <h4 style="margin:6px 0 10px">Propriétés</h4>
          <div id="propsPanel" style="display:grid;grid-template-columns:120px 1fr;gap:6px;font-size:12px"></div>
        </div>
      </div>

      <!-- Viewer + Analyse -->
      <div class="card">
        <!-- Barre d’outils viewer -->
        <div class="pane row mini" style="margin-bottom:0">
          <button id="btnMeasure" class="btn btn-outline mini">MESURE</button>
          <button id="btnAnnot" class="btn btn-outline mini">ANNOTATION</button>

          <button class="btn btn-outline mini clipAxis" data-axis="x">COUPE X</button>
          <button class="btn btn-outline mini clipAxis" data-axis="y">COUPE Y</button>
          <button class="btn btn-outline mini clipAxis" data-axis="z">COUPE Z</button>
          <input id="clipRange" type="range" min="-100" max="100" value="0" />
          <div style="flex:1"></div>
          <button id="btnShot" class="btn btn-outline mini">SCREENSHOT</button>
        </div>

        <!-- Zone viewer -->
        <div id="viewerShell" class="pane" style="padding-top:8px">
          <div id="viewerContainer">
            <canvas id="xeokit-canvas"></canvas>
            <!-- IMPORTANT : overlay parfaitement superposé -->
            <div id="overlayHost"></div>

            <!-- Trièdre d'axes (overlay simple) -->
            <div id="axisOverlay" class="axis-overlay">
              <canvas id="axisCanvas" width="84" height="84"></canvas>
            </div>
          </div>

          <!-- === Panneau Analyse === -->
          <div id="analysisPanel" class="pane" style="margin-top:12px;padding:10px;border-radius:10px;background:#fafafa;border:1px solid #eee">
            <div class="row mini" style="gap:16px;align-items:center;flex-wrap:wrap">
              <div style="display:flex;align-items:baseline;gap:6px">
                <div style="font-size:12px;color:#666">Volume</div>
                <div id="volVal" style="font-weight:600">—</div>
                <div style="font-size:12px;color:#666">cm³</div>
              </div>

              <div style="display:flex;align-items:baseline;gap:6px">
                <div style="font-size:12px;color:#666">Épaisseur min</div>
                <div id="tminVal" style="font-weight:600">—</div>
                <div style="font-size:12px;color:#666">mm</div>
              </div>

              <div style="display:flex;align-items:baseline;gap:6px">
                <div style="font-size:12px;color:#666">Épaisseur max</div>
                <div id="tmaxVal" style="font-weight:600">—</div>
                <div style="font-size:12px;color:#666">mm</div>
              </div>
            </div>

            <div class="row mini" style="gap:16px;align-items:center;flex-wrap:wrap;margin-top:8px">
              <div style="display:flex;align-items:baseline;gap:6px">
                <div style="font-size:12px;color:#666">Surface projetée</div>
                <div id="projVal" style="font-weight:600">—</div>
                <div style="font-size:12px;color:#666">cm²</div>
              </div>

              <div class="row mini" style="gap:10px;align-items:center">
                <span style="font-size:12px;color:#666">Axe :</span>
                <label style="display:flex;align-items:center;gap:6px">
                  <input type="radio" name="projAxis" id="axisX" value="X" /> <span>X</span>
                </label>
                <label style="display:flex;align-items:center;gap:6px">
                  <input type="radio" name="projAxis" id="axisY" value="Y" /> <span>Y</span>
                </label>
                <label style="display:flex;align-items:center;gap:6px">
                  <input type="radio" name="projAxis" id="axisZ" value="Z" checked /> <span>Z</span>
                </label>
              </div>
            </div>
          </div>
          <!-- === /Panneau Analyse === -->

          <!-- Progression -->
          <div class="row mini" style="margin-top:10px;opacity:.8">
            <div style="font-size:12px">Progression</div>
            <div style="flex:1;background:#eef0f3;height:6px;border-radius:4px;overflow:hidden">
              <div id="progressBar" style="height:100%;background:#c2d6ff;width:0%"></div>
            </div>
          </div>
        </div>
      </div>
      <!-- /Viewer + Analyse -->
    </div> <!-- /grid -->
  </div> <!-- /wrap -->

  <!-- IMPORTANT : main.js est un module car il contient des "import" -->
  <script type="module" src="/static/js/main.js"></script>

  <script type="module">
    // Petit module pour dessiner le trièdre et refléter l'axe choisi
    function drawAxes(selected='Z'){
      const canvas = document.getElementById('axisCanvas');
      if(!canvas) return;
      const ctx = canvas.getContext('2d');
      const W=canvas.width, H=canvas.height, cx=W/2, cy=H/2, L=26;

      ctx.clearRect(0,0,W,H);
      // fond subtil
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      ctx.fillRect(0,0,W,H);

      function arrow(x1,y1,x2,y2,label,color){
        ctx.strokeStyle=color; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
        const ang = Math.atan2(y2-y1, x2-x1);
        ctx.beginPath();
        ctx.moveTo(x2,y2);
        ctx.lineTo(x2-6*Math.cos(ang-0.5), y2-6*Math.sin(ang-0.5));
        ctx.lineTo(x2-6*Math.cos(ang+0.5), y2-6*Math.sin(ang+0.5));
        ctx.closePath(); ctx.fillStyle=color; ctx.fill();
        ctx.font='12px Inter, system-ui, sans-serif'; ctx.fillStyle=color;
        ctx.fillText(label, x2+4, y2+4);
      }

      const dim = '#9aa3af', sel = '#111827';
      const cX = (selected==='X') ? sel : dim;
      const cY = (selected==='Y') ? sel : dim;
      const cZ = (selected==='Z') ? sel : dim;

      // X vers la droite, Y vers le haut, Z en pseudo 3D vers bas-gauche
      arrow(cx,cy, cx+L,cy,        'X', cX);
      arrow(cx,cy, cx,cy-L,        'Y', cY);
      arrow(cx,cy, cx-0.7*L,cy+0.7*L, 'Z', cZ);
    }

    // init
    drawAxes('Z');

    // écoute les radios de sélection d'axe
    document.addEventListener('change', (ev)=>{
      const t = ev.target;
      if (t && t.name === 'projAxis') drawAxes(t.value);
    });
  </script>

  <script type="module">
    import {
      Viewer, XKTLoaderPlugin, FastNavPlugin, NavCubePlugin,
      SectionPlanesPlugin, AnnotationsPlugin,
      DistanceMeasurementsPlugin, DistanceMeasurementsMouseControl
    } from "https://cdn.jsdelivr.net/npm/@xeokit/xeokit-sdk@latest/dist/xeokit-sdk.es.min.js";

    console.log("module ok"); // test minimal
  </script>
  <script type="module" src="/static/js/ping.js"></script>
</body>
</html>
