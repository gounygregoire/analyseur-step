<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Analyse & Visualisation 3D • CADlytics</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    :root{--green:#3b5b39;--card:#fff}
    body{background:#f6f4ef;color:#283327;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    .wrap{max-width:1280px;margin:20px auto;padding:0 16px}
    .grid{display:grid;grid-template-columns:320px 1fr;gap:18px}
    .card{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 8px 28px rgba(0,0,0,.06)}
    .row{display:flex;gap:8px;align-items:center;margin:6px 0}
    .row.mini{gap:6px;margin:4px 0}
    .btn{padding:8px 12px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;cursor:pointer}
    .btn:hover{background:#f6f6f9}
    .btn-primary{background:var(--green);color:#fff;border-color:transparent}
    .btn-outline{background:#fff;border:1px solid #cbd5e1}
    .btn[disabled]{opacity:.5;cursor:not-allowed}
    #viewerShell{position:relative}
    #viewerContainer{position:relative; width:100%; min-height:560px; border-radius:14px; overflow:hidden; background:#fff}
    #xeokit-canvas{width:100%;height:100%;display:block}
    /* overlays HTML pilotés par AnnotationsPlugin */
    #overlayHost{position:absolute; inset:0; pointer-events:none}
    .dot{width:10px;height:10px;border-radius:999px;background:#22c55e;border:2px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.2)}
    .bubble{padding:6px 8px;border-radius:10px;background:rgba(20,20,20,.85);color:#fff;font-size:12px;white-space:nowrap}
    /* plaque de coupe (overlay indicatif) */
    .cutplate{width:120px;height:120px;border-radius:10px;background:rgba(59,91,57,.18);border:1px dashed rgba(59,91,57,.55)}
    /* thème sombre limité au viewer */
    .dark #viewerContainer{background:#0f1214}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Analyse & Visualisation 3D <small style="opacity:.6;font-weight:500">xeokit • XKT</small></h1>

    <div class="grid">
      <!-- Panneau gauche -->
      <div class="card">
        <h3 style="margin:0 0 8px">Fichiers</h3>
        <div class="row">
          <input id="fileInput" type="file" accept=".stp,.step,.stl" hidden>
          <button id="btnChoose" class="btn btn-primary">CHOISIR</button>
          <button id="btnVisualiser" class="btn">VISUALISER</button>
          <label style="margin-left:auto;font-size:12px">
            <input id="chkAdditive" type="checkbox"> Ajouter (multi-modèles)
          </label>
        </div>
        <div id="fileName" class="row" style="opacity:.7;font-size:12px">Aucun fichier sélectionné</div>

        <h3 style="margin:10px 0 6px">Navigation</h3>
        <div class="row mini">
          <button id="btnFit" class="btn btn-outline mini">FIT</button>
          <button id="btnProj" class="btn btn-outline mini">PERSPECTIVE</button>
          <select id="navMode" class="btn">
            <option value="orbit">ORBIT</option>
            <option value="firstPerson">FIRST-PERSON</option>
            <option value="pan">PAN</option>
          </select>
        </div>
        <div class="row mini">
          <label><input id="chkEdges" type="checkbox" checked> Arêtes</label>
          <label><input id="chkXray"  type="checkbox"> X-ray</label>
          <label><input id="chkGhost" type="checkbox"> Ghost</label>
        </div>
        <div class="row mini">
          <label><input id="chkTheme" type="checkbox"> Thème sombre</label>
        </div>

        <h3 style="margin:10px 0 6px">Modèles</h3>
        <div id="modelsList" class="row" style="flex-direction:column;align-items:stretch"></div>
        <div class="row mini">
          <button id="btnReload" class="btn btn-outline mini">RECHARGER</button>
          <button id="btnUnload" class="btn btn-outline mini">DÉCHARGER</button>
        </div>

        <h3 style="margin:10px 0 6px">Sélection</h3>
        <div class="row mini">
          <button id="btnIsolate"  class="btn btn-outline mini">ISOLER</button>
          <button id="btnHide"     class="btn btn-outline mini">CACHER</button>
        </div>
        <div class="row mini">
          <button id="btnShowOnly" class="btn btn-outline mini">MONTRER SEUL</button>
          <button id="btnClearSel" class="btn btn-outline mini">TOUT MONTRER</button>
        </div>
        <div class="row mini" style="align-items:center">
          <small style="opacity:.7">Opacité</small>
          <input id="opacityRange" type="range" min="0.1" max="1" step="0.05" value="1" style="flex:1">
        </div>

        <h3 style="margin:10px 0 6px">Recherche</h3>
        <div class="row">
          <input id="searchInput" class="btn" placeholder="ID / TYPE / NOM…" style="flex:1">
          <button id="btnSearch" class="btn btn-outline">RECHERCHER</button>
        </div>
        <div id="results" style="font-size:12px;max-height:140px;overflow:auto"></div>

        <h3 style="margin:10px 0 6px">Propriétés</h3>
        <div id="propsPanel" style="display:grid;grid-template-columns:120px 1fr;gap:6px;font-size:12px"></div>
      </div>

      <!-- Viewer -->
      <div id="viewerShell" class="card">
        <div class="row mini" style="margin-bottom:8px">
          <button id="btnMeasure" class="btn btn-outline mini">MESURE</button>
          <button id="btnAnnot"   class="btn btn-outline mini">ANNOTATION</button>
          <!-- Coupe : aucun axe sélectionné par défaut, un seul à la fois -->
          <button class="btn btn-outline mini clipAxis" data-axis="x">COUPE X</button>
          <button class="btn btn-outline mini clipAxis" data-axis="y">COUPE Y</button>
          <button class="btn btn-outline mini clipAxis" data-axis="z">COUPE Z</button>
          <input id="clipRange" type="range" min="-100" max="100" value="0" style="margin-left:8px;flex:1">
          <button id="btnShot" class="btn btn-outline mini">SCREENSHOT</button>
        </div>

        <div id="viewerContainer">
          <canvas id="xeokit-canvas"></canvas>
          <!-- Overlays HTML pour points/étiquettes/plaques -->
          <div id="overlayHost"></div>
        </div>

        <!-- barre de progression fine -->
        <div class="row mini" style="margin-top:10px">
          <small style="opacity:.7">Explode</small>
          <input id="explodeRange" type="range" min="0" max="1" step="0.01" value="0" style="flex:1">
          <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
            <small style="opacity:.7">Progression</small>
            <div style="width:140px;height:6px;border-radius:999px;background:#e2e8f0;position:relative;overflow:hidden">
              <div id="progressBar" style="position:absolute;inset:0 100% 0 0;background:#8bc8a6"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
