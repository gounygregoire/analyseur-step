<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Analyse & Visualisation 3D • CADlytics</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <style>
      :root{
        --bg:#f6f4ef; --ink:#283327; --muted:#5a675d;
        --brand:#3b5b39; --brand-2:#476a45; --card:#fff; --ring:rgba(59,91,57,.18);
      }
      *{box-sizing:border-box}
      body{margin:0;background:var(--bg);color:var(--ink);
           font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif}
      .wrap{max-width:1200px;margin:24px auto;padding:0 16px}
      .headline{display:flex;align-items:baseline;gap:12px;margin:8px 0 18px}
      .headline h1{font-size:26px;margin:0}
      .headline .badge{font-size:12px;background:#e7efe6;color:var(--brand);
                       padding:4px 8px;border-radius:999px}
      .grid{display:grid;grid-template-columns:360px 1fr;gap:24px;align-items:start}
      .card{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 8px 32px rgba(0,0,0,.06)}
      .muted{color:var(--muted)}
      .row{display:flex;gap:8px;align-items:center;margin:12px 0}
      .btn{padding:10px 16px;border:0;border-radius:10px;cursor:pointer;transition:.15s}
      .btn:disabled{opacity:.6;cursor:not-allowed}
      .btn-primary{background:var(--brand);color:#fff}
      .btn-primary:hover{background:var(--brand-2)}
      .btn-ghost{background:#eef2ee;color:var(--brand)}
      #viewerCard{padding:0}
      #viewerContainer{width:100%;height:56vh;min-height:420px;position:relative;border-radius:14px;overflow:hidden}
      #xeokit-canvas{width:100%;height:100%;display:block}
      .file-name{font-size:12px;color:var(--muted);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      [data-dropzone]{transition:.2s}
      [data-dropzone].is-ready{outline:2px solid #2b6cb0;box-shadow:0 0 0 4px rgba(43,108,176,.18)}
      [data-dropzone].is-success{outline:2px solid #38a169;box-shadow:0 0 0 4px rgba(56,161,105,.18)}
      [data-dropzone].is-error{outline:2px solid #e53e3e;box-shadow:0 0 0 4px rgba(229,62,62,.18)}
      .hint{font-size:12px;color:var(--muted)}
      .hr{height:1px;background:#ecebe6;margin:12px -16px}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="headline">
        <h1>Analyse & Visualisation 3D</h1>
        <span class="badge">XKT • xeokit</span>
      </div>

      <div class="grid">
        <!-- Panneau gauche -->
        <div class="card" data-dropzone>
          <h3 style="margin:4px 0 6px">Télécharger un fichier</h3>
          <p class="muted">Formats : <code>.stp</code>, <code>.step</code>, <code>.stl</code> (≤ 50&nbsp;MB)</p>

          <div class="row">
            <input id="fileInput" type="file" accept=".stl,.stp,.step" hidden />
            <button id="btnPick" class="btn btn-ghost">CHOISIR UN FICHIER</button>
            <button id="btnVisualiser" class="btn btn-primary">VISUALISER</button>
          </div>
          <div class="row" style="margin-top:-4px">
            <span id="fileName" class="file-name">Aucun fichier sélectionné</span>
          </div>

          <div class="hr"></div>

          <label for="toleranceSelect" class="muted" style="display:block;margin-top:6px;">Tolérance de conversion</label>
          <select id="toleranceSelect" style="display:block;margin-top:6px;padding:8px 10px;border-radius:10px;border:1px solid #dcd9cf;outline:none">
            <option value="standard" selected>Standard (0.1 mm)</option>
          </select>

          <p class="hint" style="margin-top:12px">
            Astuce : vous pouvez aussi <strong>glisser-déposer</strong> un fichier sur ce panneau.
          </p>
        </div>

        <!-- Viewer -->
        <div id="viewerCard" class="card">
          <div id="viewerContainer">
            <canvas id="xeokit-canvas"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- Script du viewer (module) -->
    <script type="module" src="/static/js/main.js" defer></script>
  </body>
</html>
