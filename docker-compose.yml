version: '3.9'
services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  web:
    build: .
    command: >-
      gunicorn "app:create_app()"
      --bind 0.0.0.0:8000
      --worker-class gthread
      --workers=2
      --threads=8
      --timeout=600
      --access-logfile -
      --error-logfile -
      --log-level info
    volumes:
      - .:/app
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - redis
  worker:
    build: .
    command: ./start_worker.sh
    volumes:
      - .:/app
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
