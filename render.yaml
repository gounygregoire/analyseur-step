services:
  - type: web
    name: cadlytics-web
    env: python
    buildCommand: |
      apt-get update && apt-get install -y --no-install-recommends \
        libgl1-mesa-glx \
        libglib2.0-0 \
        libxrender1 \
        libxext6 \
      && rm -rf /var/lib/apt/lists/*
      npm ci && npm run build
      pip install --no-cache-dir -r requirements.txt
    startCommand: "gunicorn app:app --workers=1 --threads=2 --timeout=600"
    envVars:
      - key: REDIS_URL
        sync: false
      - key: UPLOAD_FOLDER
        value: /tmp/uploads
      - key: OUTPUT_FOLDER
        value: /tmp/converted
      - key: MAX_UPLOAD_MB
        value: "300"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: DATA_DIR
        value: ./data # personnaliser si un volume persistant est monté
    plan: starter

  - type: worker
    name: cadlytics-worker
    env: python
    buildCommand: |
      apt-get update && apt-get install -y --no-install-recommends \
        libgl1-mesa-glx \
        libglib2.0-0 \
        libxrender1 \
        libxext6 \
      && rm -rf /var/lib/apt/lists/*
      pip install --no-cache-dir -r requirements.txt
    startCommand: "python worker.py"
    envVars:
      - key: REDIS_URL
        sync: false
      - key: UPLOAD_FOLDER
        value: /tmp/uploads
      - key: OUTPUT_FOLDER
        value: /tmp/converted
      - key: OMP_NUM_THREADS
        value: "1"
      - key: DATA_DIR
        value: ./data # personnaliser si un volume persistant est monté

databases:
  - name: cadlytics-redis
    plan: free
    ipAllowList: []
