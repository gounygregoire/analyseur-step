services:
  - type: web
    name: cadlytics-web
    plan: starter
    env: python
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: REDIS_URL
        fromService:
          type: redis
          name: cadlytics-redis
          property: connectionString
      - key: UPLOAD_FOLDER
        value: /tmp/uploads
      - key: OUTPUT_FOLDER
        value: /tmp/converted
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: OMP_NUM_THREADS
        value: "1"
    buildCommand: |
      npm ci && npm run build || true
      pip install --no-cache-dir -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers=1 --threads=2 --timeout=600

  - type: worker
    name: cadlytics-worker
    plan: starter
    env: python
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: cadlytics-redis
          property: connectionString
      - key: UPLOAD_FOLDER
        value: /tmp/uploads
      - key: OUTPUT_FOLDER
        value: /tmp/converted
    buildCommand: |
      pip install --no-cache-dir -r requirements.txt
    startCommand: python worker.py

databases:
  - name: cadlytics-redis
