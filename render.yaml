services:
  - type: web
    name: cadlytics-web
    plan: starter
    env: python
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: REDIS_URL
        fromService:
          type: redis
          name: cadlytics-redis
          property: connectionString
      - key: UPLOAD_FOLDER
        value: /tmp/uploads
      - key: OUTPUT_FOLDER
        value: /tmp/converted
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: OMP_NUM_THREADS
        value: "1"
    buildCommand: npm ci && npm run build && pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers=1 --threads=2 --timeout=600

  - type: worker
    name: cadlytics-worker
    env: python
    envVars:
      - key: REDIS_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "1"
      - key: PULL_CONVERTED_FROM_S3
        value: "true"
      - key: RQ_QUEUE_NAME
        value: "default"
      - key: RQ_JOB_TIMEOUT_SEC
        value: "1200"
    buildCommand: pip install -r requirements.txt
    startCommand: python rq_worker.py

databases:
  - name: cadlytics-redis
