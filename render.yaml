services:
  - type: web
    name: cadlytics-web
    env: python
    buildCommand: |
      npm ci
      npm run build
      pip install -r requirements.txt
    startCommand: gunicorn web:app --bind 0.0.0.0:$PORT --workers=1 --threads=2 --timeout=600
    envVars:
      - key: REDIS_URL
        fromService:
          name: cadlytics-redis
          type: redis
          property: connectionString
      - key: UPLOAD_FOLDER
        value: /tmp/uploads
      - key: OUTPUT_FOLDER
        value: /tmp/converted
      - key: MAX_UPLOAD_MB
        value: "50"

  - type: worker
    name: cadlytics-worker
    env: python
    buildCommand: |
      pip install -r requirements.txt
      curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      apt-get update && apt-get install -y nodejs
      npm ci
    startCommand: rq worker -u $REDIS_URL cadlytics
    envVars:
      - key: REDIS_URL
        fromService:
          name: cadlytics-redis
          type: redis
          property: connectionString
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "1"

databases:
  - name: cadlytics-redis
    plan: free
    ipAllowList: []
