<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Cadlytics</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="p-3">
  <div id="viewerError" class="alert alert-danger d-none" role="alert"></div>

  <div class="card mb-3" data-dropzone>
    <div class="card-body text-center">
      <p class="mb-3 text-muted">Sélectionne un fichier STEP à analyser.</p>
      <input id="fileInput" type="file" accept=".stp,.step" hidden>
      <button id="btnVisualiser" type="button" class="btn btn-primary w-100">VISUALISER</button>
    </div>
  </div>

  <div class="mb-4">
    <label for="toleranceSelect" class="form-label fw-semibold">Tolérance</label>
    <select id="toleranceSelect" class="form-select">
      <option value="standard">Standard</option>
    </select>
  </div>

  <section class="viewer-wrapper" style="height:600px;">
    <div id="viewerContainer" style="width:100%;height:100%;min-height:360px;position:relative;">
      <canvas id="xktCanvas" class="w-100 h-100"></canvas>
      <div id="statusText" class="position-absolute top-50 start-50 translate-middle text-white">
        Prévisualisation en cours…
      </div>
    </div>
  </section>

  <script>
    const MAX_UPLOAD_MB = {{ max_upload_mb }};
  </script>
  <script type="module" src="/static/dist/main.js" defer></script>
</body>
</html>
