<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Cadlytics</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/xeokit-sdk/dist/xeokit-sdk.min.js"></script>
</head>
<body class="p-3">
  <form id="uploadForm" class="mb-3">
    <input type="file" id="file" name="file" accept=".step,.stp" class="form-control mb-2" />
    <button type="submit" class="btn btn-primary">Uploader</button>
    <span id="modeBadge" class="badge bg-secondary ms-2"></span>
  </form>
  <div id="viewer" style="width:100%;height:600px;position:relative;">
    <canvas id="viewerCanvas" class="w-100 h-100"></canvas>
    <div id="statusText" class="position-absolute top-50 start-50 translate-middle text-white">
      Prévisualisation en cours…
    </div>
  </div>
  <script>
    const MAX_UPLOAD_MB = {{ max_upload_mb }};
  </script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
